<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentine's Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="page">
        <section class="card" aria-label="Funny valentine invitation">
            <p class="sticker">Top Secret Rizz File</p>
            <h1>Hey <span id="crushName">Crush</span>, can you <br>be my Valentine?</h1>
            <p class="lead">I promise premium jokes, 4K eye contact, and zero boring moments.</p>
            <p class="details">on February 14 or 15, 2026 | Kain lang </p>

            <div class="actions">
                <button id="yesBtn" class="btn btn-yes" type="button">Yes, let's gooo</button>
                <button id="noBtn" class="btn btn-no" type="button">No (sus)</button>
            </div>
        </section>

    </main>

    <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-label="Accepted message">
        <div class="modal-card">
            <h2>YESSSSS</h2>
            <p>See you my crushiecakes</p>
            <img id="victoryPhoto" alt="Bouquet victory photo" />
            <button id="closeBtn" class="btn btn-yes" type="button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
